name: Build Nestri Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install GStreamer via choco
        shell: pwsh
        run: |
          choco install gstreamer gstreamer-devel -y --no-progress
          $gst = "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          Write-Host "GStreamer path: $gst"
          Write-Host "Contents:"
          Get-ChildItem $gst
          echo "$gst\bin" >> $env:GITHUB_PATH
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Install pkg-config
        shell: pwsh
        run: choco install pkgconfiglite -y --no-progress

      - name: Build
        shell: pwsh
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\Program Files\gstreamer\1.0\msvc_x86_64
          PKG_CONFIG_PATH: C:\Program Files\gstreamer\1.0\msvc_x86_64\lib\pkgconfig
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory dist
          $gst = "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          $bin = Get-ChildItem "target\x86_64-pc-windows-msvc\release\*.exe" | Where-Object { $_.Name -notmatch "^(build|rustc)" } | Select-Object -First 1
          if ($bin) {
            Copy-Item $bin.FullName dist\nestri-server.exe
            Write-Host "Copied: $($bin.Name) -> nestri-server.exe"
          } else {
            Write-Host "WARNING: No binary found. Listing:"
            Get-ChildItem "target\x86_64-pc-windows-msvc\release\" | Select-Object Name
          }
          if (Test-Path "$gst\bin") {
            Get-ChildItem "$gst\bin\*.dll" | ForEach-Object { Copy-Item $_ dist\ }
          }
          if (Test-Path "$gst\lib\gstreamer-1.0") {
            New-Item -Force -ItemType Directory dist\gstreamer-1.0
            Get-ChildItem "$gst\lib\gstreamer-1.0\*.dll" | ForEach-Object { Copy-Item $_ dist\gstreamer-1.0\ }
          }
          Set-Content dist\nestri.env "NESTRI_ROOM=nestri-windows`r`nNESTRI_RELAY_URL=/dnsaddr/relay.dathorse.com/p2p/12D3KooWPK4v5wKYNYx9oXWjqLM8Xix6nm13o91j1Feqq98fLBsw`r`nNESTRI_GPU_VENDOR=nvidia`r`nNESTRI_VIDEO_CODEC=h264`r`nNESTRI_ENCODER_TYPE=hardware`r`nNESTRI_FRAMERATE=60`r`n"
          Set-Content dist\START.bat "@echo off`r`necho Your stream: https://xtreme-gaming.pages.dev/play?room=nestri-windows`r`nnestri-server.exe`r`npause"
          Compress-Archive dist\* NestriSetup.zip
          Get-Item NestriSetup.zip | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestriSetup-Windows
          path: NestriSetup.zip
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nestri Windows v1.0.${{ github.run_number }}
          body: |
            ## Nestri Windows Streaming Server

            **Download NestriSetup.zip, extract it, edit nestri.env to set your room name, run nestri-server.exe**

            Stream URL: https://xtreme-gaming.pages.dev/play?room=YOUR-ROOM-NAME

            Requirements: Windows 10/11 64-bit, NVIDIA GPU
          files: NestriSetup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
