name: Build Nestri Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install GStreamer (runtime + dev)
        run: |
          $gst_ver = "1.24.10"
          $base_url = "https://gstreamer.freedesktop.org/data/pkg/windows/$gst_ver/msvc"

          Write-Host "Downloading GStreamer runtime..."
          Invoke-WebRequest -Uri "$base_url/gstreamer-1.0-msvc-x86_64-$gst_ver.msi" -OutFile gst-runtime.msi
          Write-Host "Downloading GStreamer dev..."
          Invoke-WebRequest -Uri "$base_url/gstreamer-1.0-devel-msvc-x86_64-$gst_ver.msi" -OutFile gst-devel.msi

          Write-Host "Installing GStreamer runtime..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i gst-runtime.msi /quiet INSTALLDIR="C:\gstreamer\1.0\msvc_x86_64"'
          Write-Host "Installing GStreamer dev..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i gst-devel.msi /quiet INSTALLDIR="C:\gstreamer\1.0\msvc_x86_64"'

          # Add to PATH
          echo "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Install pkg-config
        run: |
          choco install pkgconfiglite -y
        shell: pwsh

      - name: Build nestri-server.exe
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gstreamer\1.0\msvc_x86_64
          PKG_CONFIG_PATH: C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig

      - name: Build nestri-launcher.exe
        run: |
          rustc installer/nestri-launcher.rs `
            --edition 2021 `
            --target x86_64-pc-windows-msvc `
            -O `
            --extern windows `
            -L target/x86_64-pc-windows-msvc/release/deps `
            -o target/x86_64-pc-windows-msvc/release/nestri-launcher.exe `
            --crate-type bin `
            -C link-args="/SUBSYSTEM:WINDOWS"
        shell: pwsh
        continue-on-error: true

      - name: Prepare dist folder
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\x86_64-pc-windows-msvc\release\nestri-windows.exe dist\nestri-server.exe -ErrorAction SilentlyContinue
          if (Test-Path target\x86_64-pc-windows-msvc\release\nestri-launcher.exe) {
            Copy-Item target\x86_64-pc-windows-msvc\release\nestri-launcher.exe dist\
          }
          # Bundle GStreamer runtime DLLs needed at runtime
          $gst_bin = "C:\gstreamer\1.0\msvc_x86_64\bin"
          $dlls = @(
            "gstreamer-1.0-0.dll","gstbase-1.0-0.dll","gstvideo-1.0-0.dll",
            "gstaudio-1.0-0.dll","gstwebrtc-1.0-0.dll","gstrtp-1.0-0.dll",
            "gstapp-1.0-0.dll","gstpbutils-1.0-0.dll",
            "libglib-2.0-0.dll","libgobject-2.0-0.dll","libgio-2.0-0.dll",
            "libgmodule-2.0-0.dll","libgthread-2.0-0.dll",
            "libffi-8.dll","libintl-8.dll","libpcre2-8-0.dll","libwinpthread-1.dll"
          )
          foreach ($dll in $dlls) {
            $src = Join-Path $gst_bin $dll
            if (Test-Path $src) {
              Copy-Item $src dist\
              Write-Host "Copied: $dll"
            }
          }
          # Copy GStreamer plugins needed
          $plugin_dir = "C:\gstreamer\1.0\msvc_x86_64\lib\gstreamer-1.0"
          New-Item -ItemType Directory -Force -Path dist\gstreamer-1.0
          $plugins = @(
            "gstd3d11.dll","gstwasapi.dll","gstnvcodec.dll",
            "gstwebrtc.dll","gstrtp.dll","gstrtpmanager.dll",
            "gstopus.dll","gstvideotestsrc.dll","gstautodetect.dll",
            "gstnice.dll","gstdtls.dll","gstsrtp.dll"
          )
          foreach ($p in $plugins) {
            $src = Join-Path $plugin_dir $p
            if (Test-Path $src) {
              Copy-Item $src dist\gstreamer-1.0\
              Write-Host "Copied plugin: $p"
            }
          }
          # Write default nestri.env
          @"
NESTRI_ROOM=nestri-windows
NESTRI_RELAY_URL=/dnsaddr/relay.dathorse.com/p2p/12D3KooWPK4v5wKYNYx9oXWjqLM8Xix6nm13o91j1Feqq98fLBsw
NESTRI_GPU_VENDOR=nvidia
NESTRI_VIDEO_CODEC=h264
NESTRI_ENCODER_TYPE=hardware
NESTRI_LATENCY=lowest-latency
NESTRI_RATE_CONTROL=cbr:8000
NESTRI_FRAMERATE=60
NESTRI_MONITOR=0
NESTRI_AUDIO_BITRATE=128
"@ | Out-File -FilePath dist\nestri.env -Encoding utf8
          Write-Host "Dist contents:"
          Get-ChildItem dist -Recurse | Select-Object FullName
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis -y
        shell: pwsh

      - name: Build installer with NSIS
        run: |
          # Copy nsi script to dist parent
          Copy-Item installer\nestri-installer.nsi nestri-installer.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" nestri-installer.nsi
          if (Test-Path NestriSetup.exe) {
            Write-Host "✅ NestriSetup.exe built successfully!"
            Get-Item NestriSetup.exe | Select-Object Name, Length
          } else {
            Write-Host "⚠️ NSIS build failed, creating zip bundle instead..."
            Compress-Archive -Path dist\* -DestinationPath NestriBundle.zip
          }
        shell: pwsh
        continue-on-error: true

      - name: Create ZIP bundle (fallback)
        run: |
          if (-not (Test-Path NestriSetup.exe)) {
            Compress-Archive -Path dist\* -DestinationPath NestriSetup.zip
            Write-Host "Created NestriSetup.zip as fallback"
          }
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestriSetup
          path: |
            NestriSetup.exe
            NestriSetup.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nestri Windows v1.0.${{ github.run_number }}"
          body: |
            ## 🎮 Nestri Windows Streaming Server

            ### Download & Run
            1. Download `NestriSetup.exe` below
            2. Double-click to install (one-click)
            3. Enter your room name when prompted
            4. Open **https://xtreme-gaming.pages.dev** on any device
            5. Type your room name → Connect → game remotely!

            ### Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU (RTX recommended for best quality)
            - Internet connection

            ### Stream URL format
            `https://xtreme-gaming.pages.dev/play?room=YOUR-ROOM-NAME`
          files: |
            NestriSetup.exe
            NestriSetup.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
