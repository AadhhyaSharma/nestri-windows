name: Build Nestri Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install GStreamer
        shell: pwsh
        run: |
          $ver = "1.24.10"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
          Invoke-WebRequest "$base/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile rt.msi -TimeoutSec 300
          Invoke-WebRequest "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi" -OutFile dev.msi -TimeoutSec 300
          Start-Process msiexec -Wait -Args '/i rt.msi /quiet INSTALLDIR=C:\gst'
          Start-Process msiexec -Wait -Args '/i dev.msi /quiet INSTALLDIR=C:\gst'
          echo "C:\gst\bin" >> $env:GITHUB_PATH
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gst" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\gst\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Install pkg-config
        shell: pwsh
        run: choco install pkgconfiglite -y --no-progress

      - name: Build
        shell: pwsh
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gst
          PKG_CONFIG_PATH: C:\gst\lib\pkgconfig
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory dist
          $bin = Get-ChildItem "target\x86_64-pc-windows-msvc\release\*.exe" | Where-Object { $_.Name -notlike "*.d" } | Select-Object -First 1
          if ($bin) { Copy-Item $bin.FullName dist\nestri-server.exe }
          foreach ($dll in (Get-ChildItem "C:\gst\bin\*.dll")) { Copy-Item $dll dist\ }
          New-Item -Force -ItemType Directory dist\gstreamer-1.0
          foreach ($p in (Get-ChildItem "C:\gst\lib\gstreamer-1.0\*.dll")) { Copy-Item $p dist\gstreamer-1.0\ }
          Set-Content dist\nestri.env "NESTRI_ROOM=nestri-windows`nNESTRI_RELAY_URL=/dnsaddr/relay.dathorse.com/p2p/12D3KooWPK4v5wKYNYx9oXWjqLM8Xix6nm13o91j1Feqq98fLBsw`nNESTRI_GPU_VENDOR=nvidia`nNESTRI_VIDEO_CODEC=h264`nNESTRI_ENCODER_TYPE=hardware`nNESTRI_FRAMERATE=60`nNESTRI_RATE_CONTROL=cbr:8000`n"
          Set-Content dist\START.bat "@echo off`necho Your stream URL: https://xtreme-gaming.pages.dev/play?room=nestri-windows`nnestri-server.exe`npause"
          Compress-Archive dist\* NestriSetup.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestriSetup-Windows
          path: NestriSetup.zip
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nestri Windows v1.0.${{ github.run_number }}
          body: |
            ## Nestri Windows Streaming Server

            **Download NestriSetup.zip, extract it, edit nestri.env to set your room name, then run nestri-server.exe**

            Your stream URL: https://xtreme-gaming.pages.dev/play?room=YOUR-ROOM-NAME

            Requirements: Windows 10/11 64-bit, NVIDIA GPU
          files: NestriSetup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
