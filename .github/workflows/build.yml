name: Build Nestri Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install GStreamer (runtime + dev)
        shell: pwsh
        run: |
          $gst_ver = "1.24.10"
          $base_url = "https://gstreamer.freedesktop.org/data/pkg/windows/$gst_ver/msvc"

          Write-Host "Downloading GStreamer runtime..."
          Invoke-WebRequest -Uri "$base_url/gstreamer-1.0-msvc-x86_64-$gst_ver.msi" -OutFile gst-runtime.msi -TimeoutSec 300
          Write-Host "Downloading GStreamer dev..."
          Invoke-WebRequest -Uri "$base_url/gstreamer-1.0-devel-msvc-x86_64-$gst_ver.msi" -OutFile gst-devel.msi -TimeoutSec 300

          Write-Host "Installing GStreamer runtime..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i gst-runtime.msi /quiet INSTALLDIR="C:\gstreamer\1.0\msvc_x86_64"'
          Write-Host "Installing GStreamer dev..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i gst-devel.msi /quiet INSTALLDIR="C:\gstreamer\1.0\msvc_x86_64"'

          echo "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "GStreamer installed OK"

      - name: Install pkg-config
        shell: pwsh
        run: choco install pkgconfiglite -y --no-progress

      - name: Build nestri-server.exe
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc 2>&1
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gstreamer\1.0\msvc_x86_64
          PKG_CONFIG_PATH: C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig

      - name: Prepare dist folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # Main server binary
          if (Test-Path "target\x86_64-pc-windows-msvc\release\nestri-windows.exe") {
            Copy-Item "target\x86_64-pc-windows-msvc\release\nestri-windows.exe" "dist\nestri-server.exe"
            Write-Host "Copied nestri-server.exe"
          } elseif (Test-Path "target\x86_64-pc-windows-msvc\release\nestri_windows.exe") {
            Copy-Item "target\x86_64-pc-windows-msvc\release\nestri_windows.exe" "dist\nestri-server.exe"
            Write-Host "Copied nestri-server.exe (underscore variant)"
          } else {
            Write-Host "WARNING: nestri-server binary not found, listing release dir:"
            Get-ChildItem "target\x86_64-pc-windows-msvc\release\*.exe" | Select-Object Name
          }

          # GStreamer runtime DLLs
          $gst_bin = "C:\gstreamer\1.0\msvc_x86_64\bin"
          $dlls = @(
            "gstreamer-1.0-0.dll","gstbase-1.0-0.dll","gstvideo-1.0-0.dll",
            "gstaudio-1.0-0.dll","gstwebrtc-1.0-0.dll","gstrtp-1.0-0.dll",
            "gstapp-1.0-0.dll","gstpbutils-1.0-0.dll",
            "libglib-2.0-0.dll","libgobject-2.0-0.dll","libgio-2.0-0.dll",
            "libgmodule-2.0-0.dll","libgthread-2.0-0.dll",
            "libffi-8.dll","libintl-8.dll","libpcre2-8-0.dll","libwinpthread-1.dll"
          )
          foreach ($dll in $dlls) {
            $src = Join-Path $gst_bin $dll
            if (Test-Path $src) { Copy-Item $src dist\; Write-Host "DLL: $dll" }
          }

          # GStreamer plugins
          $plugin_dir = "C:\gstreamer\1.0\msvc_x86_64\lib\gstreamer-1.0"
          New-Item -ItemType Directory -Force -Path "dist\gstreamer-1.0"
          $plugins = @(
            "gstd3d11.dll","gstwasapi.dll","gstnvcodec.dll",
            "gstwebrtc.dll","gstrtp.dll","gstrtpmanager.dll",
            "gstopus.dll","gstvideotestsrc.dll","gstautodetect.dll",
            "gstnice.dll","gstdtls.dll","gstsrtp.dll"
          )
          foreach ($p in $plugins) {
            $src = Join-Path $plugin_dir $p
            if (Test-Path $src) { Copy-Item $src "dist\gstreamer-1.0\"; Write-Host "Plugin: $p" }
          }

          # nestri.env default config
          @"
NESTRI_ROOM=nestri-windows
NESTRI_RELAY_URL=/dnsaddr/relay.dathorse.com/p2p/12D3KooWPK4v5wKYNYx9oXWjqLM8Xix6nm13o91j1Feqq98fLBsw
NESTRI_GPU_VENDOR=nvidia
NESTRI_VIDEO_CODEC=h264
NESTRI_ENCODER_TYPE=hardware
NESTRI_LATENCY=lowest-latency
NESTRI_RATE_CONTROL=cbr:8000
NESTRI_FRAMERATE=60
NESTRI_MONITOR=0
NESTRI_AUDIO_BITRATE=128
"@ | Out-File -FilePath dist\nestri.env -Encoding utf8

          # Simple batch launcher (fallback if GUI launcher not built)
          @"
@echo off
echo Starting Nestri Streaming Server...
echo.
echo Your stream URL: https://xtreme-gaming.pages.dev/play?room=nestri-windows
echo.
echo Open the URL above on any device to connect and play!
echo Press Ctrl+C to stop streaming.
echo.
nestri-server.exe
pause
"@ | Out-File -FilePath dist\Start-Nestri.bat -Encoding ascii

          Write-Host ""
          Write-Host "=== dist folder contents ==="
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        continue-on-error: true
        run: |
          Copy-Item installer\nestri-installer.nsi nestri-installer.nsi -ErrorAction SilentlyContinue
          if (Test-Path nestri-installer.nsi) {
            & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 nestri-installer.nsi
            if (Test-Path NestriSetup.exe) {
              Write-Host "✅ NestriSetup.exe built!"
              Get-Item NestriSetup.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
            }
          }

      - name: Create ZIP bundle
        shell: pwsh
        run: |
          if (Test-Path NestriSetup.exe) {
            # Already have installer — also make zip for people who prefer it
            Compress-Archive -Path dist\* -DestinationPath NestriBundle.zip
          } else {
            # No installer — zip is the primary download
            Compress-Archive -Path dist\* -DestinationPath NestriSetup.zip
            Write-Host "Created NestriSetup.zip (extract and run nestri-server.exe)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NestriSetup-Windows
          path: |
            NestriSetup.exe
            NestriSetup.zip
            NestriBundle.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🎮 Nestri Windows v1.0.${{ github.run_number }}"
          body: |
            ## Nestri Windows Streaming Server

            ### ⬇️ Download & Run
            1. Download `NestriSetup.exe` (or `NestriSetup.zip` if no installer)
            2. If `.exe`: double-click → install → done!
               If `.zip`: extract → double-click `Start-Nestri.bat`
            3. Edit `nestri.env` to set your room name
            4. Open **https://xtreme-gaming.pages.dev** on any device
            5. Type your room name → Connect → game remotely! 🎮

            ### Requirements
            - Windows 10/11 64-bit
            - NVIDIA GPU (RTX recommended)
            - Internet connection

            ### Your stream URL
            `https://xtreme-gaming.pages.dev/play?room=YOUR-ROOM-NAME`

            > Edit `nestri.env` and set `NESTRI_ROOM=your-room-name` before starting.
          files: |
            NestriSetup.exe
            NestriSetup.zip
            NestriBundle.zip
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
