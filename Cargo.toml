[package]
name = "nestri-server"
version = "0.1.0-windows"
edition = "2021"

[[bin]]
name = "nestri-server"
path = "src/main.rs"

[dependencies]
# GStreamer - works natively on Windows via choco install gstreamer gstreamer-devel
gstreamer = { version = "0.22" }
gstreamer-webrtc = { version = "0.22" }

# Windows-specific: GPU enumeration via DXGI
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[dependencies.clap]
version = "4.5"
features = ["env", "derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.anyhow]
version = "1.0"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[build-dependencies]
winres = "0.1"
